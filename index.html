<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siste de Caixa - Rede Pontinhos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            padding: 10px;
            color: #333;
        }

        /* BARRA SUPERIOR COMPACTA */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            background-color: #2e7d32;
            border-radius: 4px;
        }

        .brand-title {
            font-size: 1rem;
            font-weight: bold;
            color: #2e7d32;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
        }

        .btn-nav {
            padding: 4px 8px;
            font-size: 0.75rem;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-nav:hover {
            background-color: #e2e6ea;
        }

        .btn-nav.active {
            background-color: #2e7d32;
            color: #fff;
            border-color: #2e7d32;
        }

        /* LAYOUT PRINCIPAL */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* ÁREA DE PRODUTOS */
        .products-section {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }

        .section-subtitle {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 6px;
        }

        /* BOTÕES DE PRODUTOS MAIS COMPACTOS */
        .btn-product {
            padding: 6px 4px; /* Menor preenchimento */
            font-size: 0.9rem; /* Mantém tamanho da fonte original */
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            color: #1b5e20;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-product:active {
            transform: scale(0.96);
            background-color: #c8e6c9;
        }

        .btn-product .price {
            font-size: 0.75rem;
            font-weight: normal;
            color: #388e3c;
            margin-top: 2px;
        }

        /* PAINEL LATERAL (CARRINHO E RESUMO) */
        .cart-section {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 4px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 6px;
            font-size: 0.85rem;
            border-bottom: 1px solid #f0f0f0;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        /* CONTROLES MENORES: XEPA E SOBRA */
        .compact-options {
            display: flex;
            gap: 6px;
        }

        .compact-box {
            flex: 1;
            background: #f9f9f9;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }

        .compact-box label {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .compact-box input {
            width: 100%;
            padding: 4px;
            font-size: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .btn-compact-option {
            width: 100%;
            padding: 4px;
            font-size: 0.75rem;
            background-color: #fff3e0;
            border: 1px solid #ffe0b2;
            color: #e65100;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 4px;
        }

        /* DESCONTOS COM SOMA CUMULATIVA */
        .discount-section {
            background: #fff8e1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ffe082;
        }

        .discount-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #f57f17;
            margin-bottom: 4px;
        }

        .discount-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .btn-discount {
            flex: 1;
            padding: 6px 0;
            font-size: 0.8rem;
            font-weight: bold;
            background: #ffecb3;
            border: 1px solid #ffd54f;
            border-radius: 4px;
            cursor: pointer;
            color: #5d4037;
        }

        .btn-discount:active {
            background: #ffe082;
        }

        .discount-display {
            font-size: 0.8rem;
            color: #d84315;
            font-weight: bold;
            text-align: right;
        }

        /* TOTAL E FINALIZAÇÃO */
        .total-box {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: right;
            padding: 8px;
            background: #e8f5e9;
            border-radius: 4px;
            color: #1b5e20;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-clear {
            background: #ffebee;
            color: #c62828;
        }

        .btn-finish {
            background: #2e7d32;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR COMPACTA -->
    <header class="top-bar">
        <div class="header-brand">
            <!-- Caso tenha uma imagem de logo, ajuste o 'src' -->
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z'/></svg>" class="logo-img" alt="Logo">
            <span class="brand-title">Caixa</span>
        </div>

        <nav class="nav-buttons">
            <button class="btn-nav active">Caixa</button>
            <button class="btn-nav">Cadastro</button>
            <button class="btn-nav">Relatório</button>
            <button class="btn-nav">Config</button>
        </nav>
    </header>

    <div class="main-container">
        <!-- CATÁLOGO DE PRODUTOS -->
        <main class="products-section">
            <div class="section-subtitle">Produtos Disponíveis</div>
            <div class="products-grid">
                <button class="btn-product" onclick="adicionarItem('Alface', 3.00)">
                    Alface
                    <span class="price">R$ 3,00</span>
                </button>
                <button class="btn-product" onclick="adicionarItem('Tomate 1kg', 8.50)">
                    Tomate 1kg
                    <span class="price">R$ 8,50</span>
                </button>
                <button class="btn-product" onclick="adicionarItem('Cenoura 1kg', 5.00)">
                    Cenoura 1kg
                    <span class="price">R$ 5,00</span>
                </button>
                <button class="btn-product" onclick="adicionarItem('Banana D\'água', 6.00)">
                    Banana D'água
                    <span class="price">R$ 6,00</span>
                </button>
                <button class="btn-product" onclick="adicionarItem('Mandioca 1kg', 7.00)">
                    Mandioca 1kg
                    <span class="price">R$ 7,00</span>
                </button>
                <button class="btn-product" onclick="adicionarItem('Ovos Dúzia', 12.00)">
                    Ovos Dúzia
                    <span class="price">R$ 12,00</span>
                </button>
                <button class="btn-product" onclick="adicionarItem('Melissa/Chá', 4.00)">
                    Melissa/Chá
                    <span class="price">R$ 4,00</span>
                </button>
                <button class="btn-product" onclick="adicionarItem('Cheiro Verde', 2.50)">
                    Cheiro Verde
                    <span class="price">R$ 2,50</span>
                </button>
            </div>
        </main>

        <!-- RESUMO DA COMPRA -->
        <aside class="cart-section">
            <div class="section-subtitle">Itens do Pedido</div>
            
            <ul id="cartList" class="cart-list">
                <!-- Itens adicionados aparecem aqui -->
            </ul>

            <!-- COMPACTO: XEPA E SOBRA -->
            <div class="compact-options">
                <div class="compact-box">
                    <label for="inputXepa">Xepa (R$)</label>
                    <input type="number" id="inputXepa" placeholder="0,00" step="0.50" onchange="atualizarTotais()">
                </div>
                <div class="compact-box">
                    <label>Sobra</label>
                    <button class="btn-compact-option" onclick="aplicarSobra()">Adicionar</button>
                </div>
            </div>

            <!-- DESCONTOS CUMULATIVOS -->
            <div class="discount-section">
                <div class="discount-title">Adicionar Desconto (Soma)</div>
                <div class="discount-buttons">
                    <button class="btn-discount" onclick="somarDesconto(0.10)">+ R$ 0,10</button>
                    <button class="btn-discount" onclick="somarDesconto(0.05)">+ R$ 0,05</button>
                </div>
                <div class="discount-display">
                    Desconto Total: R$ <span id="lblDesconto">0.00</span>
                </div>
            </div>

            <!-- TOTAL -->
            <div class="total-box">
                Total: R$ <span id="lblTotal">0.00</span>
            </div>

            <!-- AÇÕES -->
            <div class="action-buttons">
                <button class="btn-action btn-clear" onclick="limparTudo()">Limpar</button>
                <button class="btn-action btn-finish" onclick="finalizarVenda()">Finalizar</button>
            </div>
        </aside>
    </div>

    <script>
        let carrinho = [];
        let descontoTotal = 0;

        function adicionarItem(nome, preco) {
            carrinho.push({ nome, preco });
            renderizarCarrinho();
        }

        function somarDesconto(valor) {
            descontoTotal += valor;
            atualizarTotais();
        }

        function aplicarSobra() {
            // Exemplo de regra rápida para aplicação de sobra/ajuste
            somarDesconto(0.50);
        }

        function atualizarTotais() {
            let subtotal = carrinho.reduce((acc, item) => acc + item.preco, 0);
            
            // Pega o valor da Xepa se digitado
            let valXepa = parseFloat(document.getElementById('inputXepa').value) || 0;
            
            // Total final = Subtotal + Xepa - Desconto Total
            let totalFinal = (subtotal + valXepa) - descontoTotal;
            if (totalFinal < 0) totalFinal = 0;

            document.getElementById('lblDesconto').innerText = descontoTotal.toFixed(2);
            document.getElementById('lblTotal').innerText = totalFinal.toFixed(2);
        }

        function renderizarCarrinho() {
            const listEl = document.getElementById('cartList');
            listEl.innerHTML = '';

            carrinho.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'cart-item';
                li.innerHTML = `
                    <span>${item.nome}</span>
                    <span>R$ ${item.preco.toFixed(2)}</span>
                `;
                listEl.appendChild(li);
            });

            atualizarTotais();
        }

        function limparTudo() {
            carrinho = [];
            descontoTotal = 0;
            document.getElementById('inputXepa').value = '';
            renderizarCarrinho();
        }

        function finalizarVenda() {
            if (carrinho.length === 0) {
                alert("Carrinho vazio!");
                return;
            }
            alert("Venda finalizada com sucesso!");
            limparTudo();
        }
    </script>
</body>
</html>
